<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brasileirão Simulator Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white; 
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 10px; }
        
        /* Header */
        .header { 
            background: rgba(0,0,0,0.3); 
            padding: 15px; 
            border-radius: 15px; 
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }
        .header h1 { font-size: 24px; text-align: center; margin-bottom: 5px; }
        .league-selector { 
            display: flex; 
            gap: 10px; 
            justify-content: center; 
            margin-top: 10px;
        }
        .league-btn { 
            background: rgba(255,255,255,0.2); 
            border: 2px solid transparent;
            color: white; 
            padding: 10px 20px; 
            border-radius: 25px; 
            font-size: 14px; 
            font-weight: bold;
            cursor: pointer; 
            transition: all 0.3s;
        }
        .league-btn.active { 
            background: #f39c12; 
            border-color: #f1c40f;
            transform: scale(1.05);
        }
        
        /* Menu Principal */
        .menu { text-align: center; padding: 40px 20px; }
        .menu-btn { 
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 15px auto;
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white; 
            border: none; 
            padding: 18px 30px; 
            border-radius: 30px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }
        .menu-btn:active { transform: scale(0.95); }
        
        /* Tela de Jogo */
        .game-screen { display: none; }
        .match-controls { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 15px;
        }
        .control-btn { 
            flex: 1;
            background: rgba(255,255,255,0.2); 
            color: white; 
            border: 2px solid rgba(255,255,255,0.3);
            padding: 12px; 
            border-radius: 15px; 
            font-size: 14px; 
            font-weight: bold;
            cursor: pointer; 
            transition: all 0.3s;
        }
        .control-btn:active { background: rgba(255,255,255,0.3); }
        .control-btn.primary { background: #e74c3c; border-color: #c0392b; }
        
        /* Tabela */
        .table-container { 
            background: rgba(0,0,0,0.3); 
            border-radius: 15px; 
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { 
            background: rgba(0,0,0,0.5); 
            padding: 12px 8px; 
            text-align: center; 
            font-weight: bold;
            position: sticky;
            top: 0;
        }
        td { padding: 10px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        tr:nth-child(even) { background: rgba(255,255,255,0.05); }
        .team-cell { 
            display: flex; 
            align-items: center; 
            gap: 8px;
            text-align: left;
        }
        .team-logo { 
            width: 28px; 
            height: 28px; 
            object-fit: contain;
            background: white;
            border-radius: 50%;
            padding: 2px;
        }
        .pos-1, .pos-2, .pos-3, .pos-4 { color: #27ae60; font-weight: bold; }
        .pos-17, .pos-18, .pos-19, .pos-20 { color: #e74c3c; font-weight: bold; }
        
        /* Modal de Partida */
        .match-modal { 
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            overflow-y: auto;
        }
        .match-content { 
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .match-header { 
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .match-teams { 
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 20px 0;
        }
        .match-team { 
            text-align: center;
            flex: 1;
        }
        .match-team img { 
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            padding: 5px;
            margin-bottom: 10px;
        }
        .match-score { 
            font-size: 48px;
            font-weight: bold;
            color: #f39c12;
        }
        .match-events { 
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
        }
        .event-item { 
            padding: 10px;
            margin: 5px 0;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 14px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .event-goal { border-left: 4px solid #27ae60; }
        .event-card { border-left: 4px solid #f39c12; }
        .event-red { border-left: 4px solid #e74c3c; }
        
        .match-stats { 
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .stat-box { 
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: bold; color: #f39c12; }
        
        .close-btn { 
            position: fixed;
            top: 20px;
            right: 20px;
            background: #e74c3c;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 1001;
        }
        
        /* Team Selection Modal */
        .team-select-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            overflow-y: auto;
        }
        .team-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 20px;
        }
        .team-option {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .team-option:active {
            background: rgba(255,255,255,0.2);
            transform: scale(0.95);
        }
        .team-option img {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            padding: 3px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Menu Principal -->
    <div id="main-menu" class="menu">
        <div class="header">
            <h1>⚽ Brasileirão Simulator</h1>
            <p>Simulador Completo - Séries A, B, C e D</p>
        </div>
        <button class="menu-btn" onclick="showTeamSelection()">🎮 Jogar</button>
        <button class="menu-btn" onclick="loadGame()">📂 Carregar Jogo</button>
        <button class="menu-btn" onclick="showQuickSim()">⚡ Simulação Rápida</button>
    </div>

    <!-- Seleção de Time -->
    <div id="team-select" class="team-select-modal">
        <button class="close-btn" onclick="closeTeamSelection()">✕</button>
        <div class="header">
            <h1>Escolha seu Time</h1>
            <div class="league-selector">
                <button class="league-btn active" onclick="selectLeague('A')">Série A</button>
                <button class="league-btn" onclick="selectLeague('B')">Série B</button>
                <button class="league-btn" onclick="selectLeague('C')">Série C</button>
                <button class="league-btn" onclick="selectLeague('D')">Série D</button>
            </div>
        </div>
        <div class="team-grid" id="team-grid"></div>
    </div>

    <!-- Tela do Jogo -->
    <div id="game-screen" class="game-screen">
        <div class="header">
            <h1 id="league-title">Brasileirão Série A</h1>
            <p id="round-info">Rodada 1 de 38</p>
        </div>
        
        <div class="match-controls">
            <button class="control-btn primary" onclick="playNextMatch()">▶️ Jogar Próxima</button>
            <button class="control-btn" onclick="simAllMatches()">⏩ Simular Tudo</button>
            <button class="control-btn" onclick="saveGame()">💾 Salvar</button>
        </div>

        <div class="table-container">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th style="text-align: left;">Time</th>
                            <th>P</th>
                            <th>J</th>
                            <th>V</th>
                            <th>E</th>
                            <th>D</th>
                            <th>SG</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal de Partida -->
<div id="match-modal" class="match-modal">
    <button class="close-btn" onclick="closeMatch()">✕</button>
    <div class="match-content">
        <div class="match-header">
            <h2 id="match-title">Partida</h2>
            <div class="match-teams">
                <div class="match-team">
                    <img id="home-logo" src="" alt="">
                    <div id="home-name">Time A</div>
                </div>
                <div class="match-score" id="match-score">0 x 0</div>
                <div class="match-team">
                    <img id="away-logo" src="" alt="">
                    <div id="away-name">Time B</div>
                </div>
            </div>
        </div>
        
        <div class="match-stats">
            <div class="stat-box">
                <div>Posse de Bola</div>
                <div class="stat-value" id="possession">50%</div>
            </div>
            <div class="stat-box">
                <div>Chutes</div>
                <div class="stat-value" id="shots">0</div>
            </div>
            <div class="stat-box">
                <div>Escanteios</div>
                <div class="stat-value" id="corners">0</div>
            </div>
            <div class="stat-box">
                <div>Faltas</div>
                <div class="stat-value" id="fouls">0</div>
            </div>
        </div>
        
        <div class="match-events" id="match-events">
            <h3>Eventos da Partida</h3>
        </div>
    </div>
</div>
